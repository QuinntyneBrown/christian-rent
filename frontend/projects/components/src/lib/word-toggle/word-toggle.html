<span
  class="word-toggle"
  [class.word-toggle--side]="side()"
  role="radiogroup"
  [attr.aria-label]="label()"
>
  @for (option of options(); track option.value) {
    <label class="word-toggle__option"
      ><input
        type="radio"
        [name]="name()"
        [value]="option.value"
        [checked]="option.value === value()"
        [disabled]="disabled()"
        (change)="value.set(option.value)"
      />{{ option.label }}</label
    >
  }
</span>
