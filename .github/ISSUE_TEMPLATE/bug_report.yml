name: Bug report
description: Something in christian.rent does not work as the requirements say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not report a security vulnerability here; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Browse and search for a trailer
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Name the requirement in docs/specs/L2.md if you know it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Browse or search
        - Listing or messages
        - Post
        - Admin
        - Backend
        - End-to-end tests
        - Documentation, mocks or design system
        - Build or CI
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, operating system, browser and version, and the commit you ran.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output or a screenshot. Remove names, contact details and message text that are not your own.
      render: text
