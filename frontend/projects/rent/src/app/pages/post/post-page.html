<cr-site-header [plain]="true" />
<main id="main" class="container">
  @let draft = store.draft();
  @let copy = store.copy();
  <cr-post-layout
    fine="Prices are in CAD. An admin reviews every post before it appears on Browse."
    previewLabel="How it’ll look"
  >
    <cr-sentence
      [offer]="draft.offer"
      [kind]="draft.kind"
      (offerChange)="store.setOffer($event)"
      (kindChange)="store.setKind($event)"
    />
    <cr-line-field
      fieldId="post-title"
      [label]="copy.titleLabel"
      [placeholder]="copy.titlePlaceholder"
      [maxlength]="limits.title"
      [value]="draft.title"
      (valueChange)="store.patch({ title: $event })"
    />
    <cr-field-row>
      <cr-line-field
        fieldId="post-price"
        inputmode="decimal"
        placeholder="0"
        [label]="copy.priceLabel"
        [optional]="copy.priceOptional"
        [prefix]="copy.pricePrefix"
        [units]="periods"
        [unit]="draft.pricePeriod"
        [value]="draft.price"
        (valueChange)="store.patch({ price: $event })"
        (unitChange)="periodChosen($event)"
      />
      @if (draft.whenMode === 'text') {
        <cr-line-field
          fieldId="post-when"
          label="When"
          placeholder="Most weekends"
          switchLabel="Give dates instead"
          [maxlength]="limits.whenText"
          [value]="draft.whenText"
          (valueChange)="store.patch({ whenText: $event })"
          (switched)="store.patch({ whenMode: 'dates' })"
        />
      } @else {
        <cr-date-range
          fieldId="post-dates"
          legend="When"
          switchLabel="Describe it in words instead"
          [start]="draft.startDate"
          [end]="draft.endDate"
          (startChange)="store.patch({ startDate: $event })"
          (endChange)="store.patch({ endDate: $event })"
          (switched)="store.patch({ whenMode: 'text' })"
        />
      }
    </cr-field-row>
    <cr-line-field
      fieldId="post-area"
      label="Where"
      placeholder="City or neighbourhood"
      help="A city or neighbourhood in Canada. Never a street address."
      [maxlength]="limits.area"
      [value]="draft.area"
      (valueChange)="store.patch({ area: $event })"
    />
    @if (draft.offer === 'for-rent') {
      <cr-photo-picker fieldId="post-photos" [count]="draft.photoIds.length" [disabled]="true" />
    }
    <cr-textarea
      fieldId="post-note"
      label="Anything else?"
      optional="Optional"
      [placeholder]="copy.notePlaceholder"
      [maxlength]="limits.note"
      [value]="draft.note"
      (valueChange)="store.patch({ note: $event })"
    />
    <button
      slot="actions"
      cr-button
      type="submit"
      size="lg"
      [variant]="draft.offer === 'wanted' ? 'wanted' : 'rent'"
    >
      {{ copy.submit }}
    </button>
  </cr-post-layout>
</main>
