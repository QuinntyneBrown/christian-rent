# Deploys every commit to main to Azure (ADR 0031), once CI has passed on it: three images are
# built and pushed side by side, then infra/deploy.sh applies the migrations, releases both
# applications and asks each origin for a page and for the API. It signs in to Azure with main's
# OIDC token; no secret is stored. A failed release leaves the last one serving.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # By hand: releases the head of main again.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One release at a time, in order; a release under way is never cancelled half done.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The commit CI passed on; by hand, the head of main.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Image (${{ matrix.image }})
    # Only a push to main that CI passed; never a pull request's code.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - image: backend
            file: infra/backend.Dockerfile
          - image: rent
            file: infra/host.Dockerfile
          - image: admin
            file: infra/host.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to the registry
        id: registry
        run: |
          source infra/names.sh
          az acr login --name "$REGISTRY"
          echo "server=$(az acr show -g "$RESOURCE_GROUP" -n "$REGISTRY" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: APP=${{ matrix.image }}
          push: true
          tags: ${{ steps.registry.outputs.server }}/${{ matrix.image }}:${{ env.COMMIT }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false

  release:
    name: Release
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Migrate, release and ask each origin
        run: bash infra/deploy.sh "$COMMIT"
