<header class="site-header" [class.site-header--plain]="plain()">
  <div class="container site-header__inner">
    <cr-logo />
    @if (plain()) {
      <a
        cr-button
        variant="ghost"
        [iconOnly]="true"
        routerLink="/"
        aria-label="Close and go back to Browse"
        ><svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6 6 18" /></svg
      ></a>
    } @else {
      <div class="site-header__actions">
        @if (member(); as member) {
          <span class="member-chip" role="img" [attr.aria-label]="'Signed in as ' + member.name">{{
            member.initials
          }}</span>
        }
        <a cr-button variant="primary" size="sm" routerLink="/post"
          ><svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" /></svg
          >Post</a
        >
      </div>
    }
  </div>
</header>
