<nav class="admin-nav" aria-label="Admin">
  <cr-logo [inverse]="true" label="Admin home" />
  <p class="admin-nav__label">Admin · {{ name() }}</p>
  <ul class="admin-nav__links">
    <li>
      <a class="admin-nav__link" routerLink="/" aria-current="page" aria-label="Review queue">
        <cr-icon name="inbox" />
        <span class="admin-nav__text">Review</span>
        @if (waiting(); as waiting) {
          <span class="admin-nav__count" [attr.aria-label]="waiting + ' waiting'">{{
            waiting
          }}</span>
        }
      </a>
    </li>
  </ul>
  <div class="admin-nav__end">
    @if (siteUrl(); as siteUrl) {
      <a class="admin-nav__link admin-nav__exit" [href]="siteUrl + '/'" aria-label="Back to site">
        <cr-icon name="arrow-left" />
        <span class="admin-nav__text">Back to site</span>
      </a>
    }
    <button class="admin-nav__link" type="button" aria-label="Sign out" (click)="signOut.emit()">
      <cr-icon name="logout" />
      <span class="admin-nav__text">Sign out</span>
    </button>
  </div>
</nav>
