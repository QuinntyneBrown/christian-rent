<cr-site-header [member]="member()" />
<main id="main" class="container" tabindex="-1">

      <svg class="icon plain-page__icon-svg" aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="m15 9-2 4-4 2 2-4z" />

      <a cr-button variant="primary" routerLink="/">Go to Browse</a>
    </div>
  </section>
</main>
