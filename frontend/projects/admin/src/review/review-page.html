<cr-admin-layout [detailBusy]="store.detailState() === 'loading'">
  <cr-admin-nav slot="nav" [name]="name()" [waiting]="store.waitingCount()" />
  <ng-container slot="queue">
    <cr-queue-header
      [summary]="summary()"
      [phoneNote]="
        store.state() === 'loaded'
          ? 'Open Admin on a tablet or a computer to see an item’s detail and decide on it.'
          : null
      "
    />
    @if (store.state() === 'loaded') {
      <div #above class="review-page__spacer review-page__spacer--before" aria-hidden="true"></div>
      <div #top class="review-page__sentinel" aria-hidden="true"></div>
      <cr-queue-list>
        @for (page of store.pages(); track page.index) {
          @for (item of page.items; track item.id) {
            <li [attr.data-page]="page.index">
              <cr-queue-item
                [item]="item"
                [selectable]="wide()"
                [current]="store.selectedId() === item.id"
                (chosen)="store.select($event)"
              />
            </li>
          }
        }
      </cr-queue-list>
      <div #bottom class="review-page__sentinel" aria-hidden="true"></div>
      <div #below class="review-page__spacer review-page__spacer--after" aria-hidden="true"></div>
      @if (store.moreState(); as more) {
        @if (more !== 'done') {
          <cr-queue-more
            [state]="more"
            [shown]="store.held()"
            [total]="store.waitingCount()"
            [next]="store.nextCount()"
            (more)="loadMore()"
          />
        }
      }
    }
  </ng-container>
  <ng-container slot="detail">
    @if (store.detail(); as detail) {
      <cr-review-detail [view]="detail" />
    } @else if (store.detailSkeleton()) {
      <cr-review-detail [view]="null" />
    }
  </ng-container>
</cr-admin-layout>
