<svg
  class="icon"
  [class.icon--sm]="size() === 'sm'"
  [class.icon--lg]="size() === 'lg'"
  [class.icon--xl]="size() === 'xl'"
  viewBox="0 0 24 24"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('search') {
      <svg:circle cx="11" cy="11" r="7" />
      <svg:path d="m20 20-3.5-3.5" />
    }
    @case ('pin') {
      <svg:path d="M20 10c0 5-8 12-8 12s-8-7-8-12a8 8 0 0 1 16 0z" />
      <svg:circle cx="12" cy="10" r="3" />
    }
    @case ('calendar') {
      <svg:rect x="3" y="5" width="18" height="16" rx="2" />
      <svg:path d="M8 3v4M16 3v4M3 10h18" />
    }
    @case ('plus') {
      <svg:path d="M12 5v14M5 12h14" />
    }
    @case ('x') {
      <svg:path d="M6 6l12 12M18 6 6 18" />
    }
    @case ('check') {
      <svg:path d="m5 12 5 5L20 7" />
    }
    @case ('arrow-left') {
      <svg:path d="M19 12H5m0 0 6 6m-6-6 6-6" />
    }
    @case ('arrow-right') {
      <svg:path d="M5 12h14m0 0-6-6m6 6-6 6" />
    }
    @case ('flag') {
      <svg:path d="M5 21V4m0 0h11l-2 4 2 4H5" />
    }
    @case ('badge-check') {
      <svg:path
        d="M12 3l2.3 1.7 2.9-.1.9 2.7 2.3 1.7-.9 2.7.9 2.7-2.3 1.7-.9 2.7-2.9-.1L12 21l-2.3-1.7-2.9.1-.9-2.7-2.3-1.7.9-2.7-.9-2.7 2.3-1.7.9-2.7 2.9.1z"
      />
      <svg:path d="m9 12 2 2 4-4" />
    }
    @case ('image-plus') {
      <svg:rect x="3" y="5" width="14" height="14" rx="2" />
      <svg:path d="m3 15 4-4 6 6M19 3v6M16 6h6" />
    }
    @case ('image') {
      <svg:rect x="3" y="4" width="18" height="16" rx="2" />
      <svg:circle cx="9" cy="10" r="2" />
      <svg:path d="m3 17 5-5 4 4 3-3 6 6" />
    }
    @case ('inbox') {
      <svg:path d="M3 13h5l1 3h6l1-3h5M5 5h14l2 8v6H3v-6z" />
    }
    @case ('login') {
      <svg:path d="M14 4h5v16h-5M9 8l4 4-4 4M13 12H3" />
    }
    @case ('logout') {
      <svg:path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9" />
    }
    @case ('external') {
      <svg:path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6" />
    }
    @case ('alert') {
      <svg:path d="M12 3 2 20h20zM12 10v4M12 17v.5" />
    }
    @case ('info') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="M12 11v5M12 8v.5" />
    }
    @case ('check-circle') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="m8 12 3 3 5-6" />
    }
    @case ('x-circle') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="m9 9 6 6M15 9l-6 6" />
    }
    @case ('refresh') {
      <svg:path d="M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5" />
    }
    @case ('lock') {
      <svg:rect x="5" y="11" width="14" height="10" rx="2" />
      <svg:path d="M8 11V7a4 4 0 0 1 8 0v4" />
    }
    @case ('user') {
      <svg:circle cx="12" cy="8" r="4" />
      <svg:path d="M4 21a8 8 0 0 1 16 0" />
    }
    @case ('compass') {
      <svg:circle cx="12" cy="12" r="9" />
      <svg:path d="m15 9-2 4-4 2 2-4z" />
    }
  }
</svg>
