<nav class="segmented" [attr.aria-label]="label()">
  @for (option of options(); track option.label) {
    <a
      class="segmented__option"
      [routerLink]="[]"
      [queryParams]="option.queryParams"
      [attr.aria-current]="option.current ? 'true' : 'false'"
      >{{ option.label }} <span class="segmented__count">{{ option.count }}</span></a
    >
  }
</nav>
